services:
  # Vue.js Frontend
  carbonquest-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonquest-web
    restart: unless-stopped
    networks:
      - carbonquest-network
    expose:
      - "80"

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMWE0YTM1MGQ3M2EyYTQ5ZmNjNjdhMmE0NDc4Zjk1NDAiLCJ0IjoiZjJiMzQ5MmMtNWRjOS00Y2I3LWEzOWItODkwMjgwZDI3YWIxIiwicyI6Ik5EWTRaVFkwTjJVdE16TXdNaTAwTW1Zd0xUaGlabVV0TVRRMk1EYzVNMkpoWmprMiJ9
      - carbonquest-network
    depends_on:
      - carbonquest-web

networks:
  carbonquest-network:
    driver: bridge
